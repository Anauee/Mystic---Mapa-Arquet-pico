<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Mapa Arquetípico - Preview</title>
  <meta name="description" content="A amostra do seu Mapa Arquetípico foi gerada.">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="index.css">
  <style>
    /* Estilos específicos para a página de resultado */
    .resultado-container {
      max-width: 800px;
      margin: 80px auto;
      padding: 40px 24px;
      position: relative;
      z-index: 2;
      background: rgba(10, 10, 14, 0.7);
      border: 1px solid rgba(212, 185, 106, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .resultado-header {
      text-align: center;
      margin-bottom: 48px;
    }
    
    .resultado-header h1 {
      color: var(--color-gold);
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 16px;
    }
    
    .resultado-header p {
      color: var(--color-text-muted);
      font-size: 1.125rem;
    }

    /* Conteúdo do Relatório */
    #reportContent {
      font-size: 1.125rem;
      line-height: 1.8;
      color: #d8d0c0;
    }

    #reportContent h2 {
      color: var(--color-gold);
      font-size: 1.75rem;
      margin: 48px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(212, 185, 106, 0.15);
      font-family: 'Cormorant Garamond', serif;
    }

    #reportContent h2:first-child {
      margin-top: 0;
    }

    #reportContent p {
      margin-bottom: 24px;
    }
    
    #reportContent b, #reportContent strong {
      color: #fff;
    }

    /* Efeito de Bloqueio (Blur) */
    .pilar-bloqueado {
      position: relative;
      margin-bottom: 32px;
    }

    .blur-overlay {
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to bottom, rgba(6, 6, 10, 0) 0%, rgba(6, 6, 10, 0.95) 80%, rgba(6, 6, 10, 1) 100%);
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 20px;
    }

    .blur-overlay::after {
      content: '🔒';
      font-size: 24px;
      opacity: 0.8;
      filter: drop-shadow(0 0 10px rgba(212, 185, 106, 0.5));
    }

    .cta-container {
      margin-top: 64px;
      text-align: center;
      padding-top: 40px;
      border-top: 1px solid rgba(212, 185, 106, 0.1);
    }

    .btn-unlock {
      font-size: 1.125rem;
      padding: 18px 40px;
      box-shadow: 0 0 30px rgba(212, 185, 106, 0.2);
      animation: pulse-glow 2s infinite;
      margin-bottom: 16px;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 20px rgba(212, 185, 106, 0.2); }
      50% { box-shadow: 0 0 40px rgba(212, 185, 106, 0.5); }
      100% { box-shadow: 0 0 20px rgba(212, 185, 106, 0.2); }
    }

    .cta-texto {
      color: var(--color-text-muted);
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Stars -->
  <div class="stars-container" id="starsContainer"></div>

  <main class="resultado-container reveal">
    <div class="resultado-header">
      <h1>Seu Mapa Foi Gerado</h1>
      <p>Abaixo está a primeira parte do seu documento confidencial.</p>
    </div>

    <div id="reportContent">
      <!-- O HTML do relatório será injetado aqui -->
    </div>

    <div class="cta-container">
      <a href="#" id="btnUnlock" class="btn-primary btn-unlock">
        ✦ DESBLOQUEAR RELATÓRIO COMPLETO — R$ 9,99
      </a>
      <p class="cta-texto">Você receberá o documento completo imediatamente no seu e-mail.</p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Cria estrelas (reaproveitando lógica do main.js)
      const starsContainer = document.getElementById('starsContainer');
      for (let i = 0; i < 40; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        const size = Math.random() * 2 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
        star.style.setProperty('--delay', `${Math.random() * 2}s`);
        starsContainer.appendChild(star);
      }

      // Recupera dados do sessionStorage
      const previewHtml = sessionStorage.getItem('previewHtml');
      const leadId = sessionStorage.getItem('leadId');

      if (!previewHtml || !leadId) {
        // Se não tem os dados, manda de volta pra home
        window.location.href = 'index.html';
        return;
      }

      // Injeta o HTML gerado
      document.getElementById('reportContent').innerHTML = previewHtml;

      // Configura botão de compra
      const CHECKOUT_URL = 'https://ggcheckout.app/checkout/v2/0rMhrAKclsjLJgn5EfdA';
      const btnUnlock = document.getElementById('btnUnlock');
      btnUnlock.href = `${CHECKOUT_URL}?utm_content=${leadId}`;

      btnUnlock.addEventListener('click', (e) => {
        btnUnlock.innerHTML = '✦ REDIRECIONANDO...';
        btnUnlock.style.pointerEvents = 'none';
        btnUnlock.style.opacity = '0.7';
      });

      // Animação reveal
      setTimeout(() => {
        document.querySelector('.resultado-container').classList.add('visible');
      }, 100);
    });
  </script>
</body>
</html>
